# Render's free web services sleep after 15 minutes idle and take ~50 s to wake. Discord
# gives the "Play now!" button only 3 s to get an answer, so ping the API to keep it awake.
name: keep API awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://dota-build-daily-api.onrender.com/health
