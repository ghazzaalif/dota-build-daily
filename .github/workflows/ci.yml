name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle size budget (≤ 200 KB gzipped JS, PRD §11)
        run: |
          size=$(cat dist/assets/*.js | gzip -c | wc -c)
          echo "JS gzipped: $size bytes"
          test "$size" -le 204800
